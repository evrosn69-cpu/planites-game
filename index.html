<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0b22">
<meta name="description" content="Ένα διαστημικό παιχνίδι φτιαγμένο από σχέδια στο χαρτί.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Πλανήτες">
<title>Πλανήτες και Τέρατα</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one arcade-cabinet column — name plate, 16:9 pixel screen with its control pad, small tools */
:root{
  --space:#0c0b22; --panel:#17153d; --line:#2e2b6b; --ink:#f3eedc; --muted:#aaa7d8;
  --accent:#5fd3c4; --gold:#ffcf4a; --fire:#5a1f2c; --fire-line:#a3394f;
  --px:"Press Start 2P",ui-monospace,"Courier New",monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--space);color:var(--ink)}
body{font-family:var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}
body.touch{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
h1{font-family:var(--px);font-weight:400;font-size:16px;line-height:1.6;margin:0;color:var(--gold);text-wrap:balance}
.sub{font-size:13px;color:var(--muted)}
.screen{position:relative;border:3px solid var(--line);border-radius:6px;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
.rotate{display:none;font:12px var(--ui);color:var(--muted);text-align:center;padding:8px 10px 0;background:var(--space)}
.pad{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:12px;background:var(--space);touch-action:none}
.pad .grp{display:flex;gap:10px;align-items:flex-end}
.pad button{font-family:var(--px);font-size:12px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:50%;width:76px;height:76px;padding:0;touch-action:none}
.pad button.fire{background:var(--fire);border-color:var(--fire-line)}
.pad button.auto{width:58px;height:58px;font-size:9px;border-radius:14px;color:var(--muted)}
.pad button.auto.lit{color:var(--space);background:var(--gold);border-color:var(--gold)}
.pad button.on{background:var(--accent);border-color:var(--accent);color:var(--space)}
@media (orientation: portrait){ body.touch .rotate{display:block} }
@media (orientation: landscape){
  body.touch{padding-block:6px}
  body.touch header,body.touch .tools{display:none}
  body.touch .screen{width:min(100%,calc((100dvh - 18px) * 16 / 9));margin:0 auto}
  body.touch .pad{position:absolute;left:0;right:0;bottom:0;background:none;padding:10px 12px;pointer-events:none}
  body.touch .pad button{pointer-events:auto;width:64px;height:64px;font-size:10px;background:rgba(23,21,61,.45);border-color:rgba(243,238,220,.35)}
  body.touch .pad button.fire{background:rgba(90,31,44,.55)}
  body.touch .pad button.auto{width:50px;height:50px;font-size:8px}
  body.touch .pad button.auto.lit{background:rgba(255,207,74,.85)}
  body.touch .pad button.on{background:rgba(95,211,196,.8)}
}
.hints{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);align-items:center}
kbd{font-family:var(--px);font-size:10px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools button{font:13px var(--ui);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer}
.tools button:hover{color:var(--ink);border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
@media (display-mode: standalone), (display-mode: fullscreen){
  body{padding-block:8px;min-height:100dvh;box-sizing:border-box}
  header,.tools{display:none}
  .wrap{justify-content:center;gap:10px}
  body:not(.touch) .screen{width:min(100%,calc((100dvh - 60px) * 16 / 9));align-self:center}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Πλανήτες και Τέρατα</h1>
    <span class="sub">Ένα διαστημικό παιχνίδι φτιαγμένο από σχέδια στο χαρτί</span>
  </header>
  <div class="screen">
    <canvas id="game" width="480" height="270" aria-label="Παιχνίδι: διάλεξε πλανήτη, διάλεξε επίπεδο και πολέμησε τα τέρατα"></canvas>
    <div class="rotate">Γύρισε τη συσκευή οριζόντια για μεγαλύτερη οθόνη</div>
    <div class="pad" id="pad" hidden>
      <div class="grp"><button id="b-left" data-k="left" aria-label="Αριστερά">◀</button><button id="b-right" data-k="right" aria-label="Δεξιά">▶</button></div>
      <div class="grp"><button id="b-auto" class="auto" aria-pressed="false">ΑΥΤΟ<br>ΦΩΤΙΑ</button><button id="b-jump" data-k="jump">ΑΛΜΑ</button><button id="b-fire" data-k="fire" class="fire">ΦΩΤΙΑ</button></div>
    </div>
  </div>
  <div class="hints" id="hints">
    <span><kbd>←</kbd> <kbd>→</kbd> κίνηση</span>
    <span><kbd>↑</kbd> άλμα</span>
    <span><kbd>Space</kbd> φωτιά</span>
    <span><kbd>F</kbd> αυτόματη φωτιά</span>
    <span><kbd>Enter</kbd> επιλογή</span>
    <span><kbd>Esc</kbd> πίσω στον χάρτη</span>
  </div>
  <div class="tools">
    <button id="snd">Ήχος: ναι</button>
    <button id="unlock">Ξεκλείδωσε όλους τους πλανήτες</button>
    <button id="reset">Νέο παιχνίδι</button>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const W=480,H=270,GY=222,OUT='#1a1830',FONT='"Press Start 2P", ui-monospace, monospace';
ctx.imageSmoothingEnabled=false;
try{document.fonts.load('16px "Press Start 2P"','ΔΙΑΛΕΞΕ ΠΛΑΝΗΤΗ 100%')}catch(e){}
const coarse=matchMedia('(pointer: coarse)').matches;

/* ---------- progress: levels beaten per planet ---------- */
const SKEY='planites-terata-v2';
let done=[0,0,0,0,0,0,0],allOpen=false,autoFire=coarse;
try{
  const s=JSON.parse(localStorage.getItem(SKEY)||'null');
  if(s&&Array.isArray(s.done)){s.done.forEach((v,i)=>{if(i<7)done[i]=Math.max(0,Math.min(3,v|0))});allOpen=!!s.allOpen;if(typeof s.auto==='boolean')autoFire=s.auto}
  else{const v=parseInt(localStorage.getItem('planites-terata-v1'),10);if(v>0)for(let p=0;p<4;p++)done[p]=Math.max(0,Math.min(3,v-p*3))}
}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify({done,allOpen,auto:autoFire}))}catch(e){}}
const unlocked=p=>allOpen||p===0||(p<=3?done[p-1]>=3:done[3]>=3);
const levelOpen=(p,l)=>unlocked(p)&&(allOpen||l<=done[p]);

/* ---------- sound ---------- */
let ac=null,muted=false;
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f1,f2,dur,type,vol,delay){if(!ac||muted)return;const t=ac.currentTime+(delay||0);const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol||.04,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02)}
const SFX={
  shoot:()=>tone(900,420,.07,'square',.022),hit:()=>tone(230,140,.05,'square',.035),
  pop:()=>tone(500,1300,.13,'square',.045),jump:()=>tone(280,620,.12,'square',.025),
  hurt:()=>tone(180,70,.25,'sawtooth',.05),pick:()=>{tone(660,660,.07,'square',.035);tone(990,990,.1,'square',.035,.07)},
  boss:()=>tone(120,80,.6,'sawtooth',.06),spit:()=>tone(160,320,.1,'triangle',.05),sel:()=>tone(520,520,.05,'square',.025),
  charge:()=>tone(200,900,.5,'triangle',.04),laser:()=>tone(1200,300,.45,'sawtooth',.035),beam:()=>tone(90,60,.6,'square',.04),
  clear:()=>[523,659,784,1046].forEach((f,i)=>tone(f,f,.14,'square',.045,i*.12)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,f,.18,'square',.045,i*.15)),
  rocket:()=>tone(80,400,1.4,'sawtooth',.05)
};
const sfx=n=>SFX[n]&&SFX[n]();
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- helpers ---------- */
function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hsh=n=>(Math.imul(n|0,2654435761)>>>0)%1000;
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function F(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function T(s,x,y,o){o=o||{};const sz=o.size||8;ctx.font=sz+'px '+FONT;ctx.textAlign=o.align||'left';ctx.textBaseline='top';x=Math.round(x);y=Math.round(y);if(o.shadow!==false){ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1)}ctx.fillStyle=o.col||'#f3eedc';ctx.fillText(s,x,y)}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function ell(x,y,rx,ry,c,sw){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);if(c){ctx.fillStyle=c;ctx.fill()}if(sw){ctx.strokeStyle=OUT;ctx.lineWidth=sw;ctx.stroke()}}
function limb(x1,y1,x2,y2,w,c){ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=OUT;ctx.lineWidth=w+1.5;ctx.stroke();ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()}
function claws(x,y,c){limb(x,y,x-1.7,y+2.5,.8,c);limb(x,y,x,y+2.9,.8,c);limb(x,y,x+1.7,y+2.5,.8,c)}
function feet(x,y,c){limb(x,y,x-2.6,y+.2,1,c);limb(x,y,x+2.8,y+.2,1,c)}
function zig(x,y,w,n,h){ctx.beginPath();ctx.moveTo(x,y);for(let i=0;i<n;i++){ctx.lineTo(x+(i+.5)*w/n,y+h);ctx.lineTo(x+(i+1)*w/n,y)}ctx.fillStyle='#ffffff';ctx.fill()}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

/* ---------- data from the sketches ---------- */
const PL=[
  {name:'ΦΕΓΓΑΡΙ',g:.19,jump:-5.3,o2:1,  sky:'#07081c',top:'#d3d6df',ground:'#9ea3b0',band:'#7c818f',spot:'#666b79',types:[0,0,1],hint:'ΧΑΜΗΛΗ ΒΑΡΥΤΗΤΑ: ΠΗΔΑΣ ΨΗΛΑ'},
  {name:'ΑΡΗΣ',   g:.33,jump:-6.4,o2:1.1,sky:'#1d0a12',top:'#eea06e',ground:'#d06b45',band:'#9c3a2a',spot:'#7a2b20',types:[0,1,2],storm:true,hint:'ΠΡΟΣΟΧΗ ΣΤΗΝ ΑΜΜΟΘΥΕΛΛΑ'},
  {name:'ΚΡΟΝΟΣ', g:.33,jump:-6.6,o2:1.15,sky:'#100c22',top:'#f6e3ad',ground:'#d9b874',band:'#a9824a',spot:'#8b6a3c',types:[0,1,3],gaps:true,hint:'ΠΗΔΑ ΤΑ ΚΕΝΑ ΣΤΑ ΔΑΧΤΥΛΙΔΙΑ'},
  {name:'ΔΙΑΣ',   g:.5, jump:-7.6,o2:1.3,sky:'#140814',top:'#f4b07a',ground:'#e0784a',band:'#b23c2c',spot:'#8a3a2c',types:[0,1,2,3],hint:'ΒΑΡΙΑ ΒΑΡΥΤΗΤΑ: ΜΙΚΡΑ ΑΛΜΑΤΑ'},
  {name:'ΟΥΡΑΝΟΣ',g:.3, jump:-6.2,o2:1.2,sky:'#0a1620',top:'#effcff',ground:'#a9dbe3',band:'#6fb3c2',spot:'#5a97a6',types:[0,1,2,3],ice:true,hint:'ΠΑΓΟΣ: ΤΟ ΕΔΑΦΟΣ ΓΛΙΣΤΡΑΕΙ'},
  {name:'ΠΟΣΕΙΔΩΝΑΣ',g:.36,jump:-6.7,o2:1.25,sky:'#060c2a',top:'#8fd0f5',ground:'#2f6fb0',band:'#1f4f8c',spot:'#183e70',types:[0,1,2,3],wind:true,hint:'ΔΥΝΑΤΟΙ ΑΝΕΜΟΙ ΣΕ ΣΠΡΩΧΝΟΥΝ'},
  {name:'ΗΛΙΟΣ',  g:.4, jump:-7,  o2:1.4,sky:'#2a0806',top:'#ffe08a',ground:'#ff8a2a',band:'#e0461e',spot:'#b8321a',types:[0,1,2,3],fire:true,hint:'ΠΡΟΣΟΧΗ ΣΤΙΣ ΦΛΟΓΕΣ ΑΠΟ ΨΗΛΑ'}
];
const MT=[
  {w:12,h:20,hp:2,speed:.9, dmg:8, col:'#5cc28f',diff:0},  // small green
  {w:14,h:26,hp:3,speed:.55,dmg:8, col:'#a9abb6',diff:0},  // plain grey
  {w:18,h:28,hp:5,speed:.8, dmg:12,col:'#8f919d',diff:1},  // grey with teeth, jumps
  {w:18,h:30,hp:6,speed:.6, dmg:6, col:'#55a7cf',diff:1},  // tentacles, grabs
  {w:42,h:58,hp:20,speed:.6,dmg:18,col:'#4fa3c7',diff:2},  // leader, belly mouth
  {w:44,h:26,hp:26,speed:.9,dmg:12,col:'#5cc9a7',diff:1},  // hovering saucer with beam
  {w:74,h:40,hp:44,speed:0, dmg:16,col:'#5cc9a7',diff:3}   // big saucer with laser
];
const DIFF=[['ΕΥΚΟΛΟ','#9be15d'],['ΔΥΣΚΟΛΟ','#ffb347'],['ΠΟΛΥ ΔΥΣΚΟΛΟ','#ff6b6b'],['ΠΑΡΑ ΠΟΛΥ ΔΥΣΚΟΛΟ','#ff5fb0']];
const STARS=[...Array(90)].map((_,i)=>{const r=rng(i*13+1);return{x:r()*960,y:r()*205,s:r()<.15?2:1,tw:r()*6}});

/* ---------- state ---------- */
let state='planets',sel=0,lsel=0,cur={p:0,l:0},lv=null,player=null,camX=0,tick=0,banner=null,endInfo={},hits=[];
const keys={left:0,right:0,jump:0,fire:0};

function supported(a,b){return lv.segs.some(s=>s[0]<b&&s[1]>a)}
function solid(a,b){return lv.segs.some(s=>a>=s[0]&&b<=s[1])}
function gapAt(x){const s=lv.segs;for(let i=0;i<s.length-1;i++)if(x>=s[i][1]&&x<s[i+1][0])return[s[i][1],s[i+1][0]];return null}

function mk(t,x,p){const M=MT[t],hp=M.hp+Math.floor(Math.min(p,5)/2);return{t,x,y:GY-M.h,w:M.w,h:M.h,vx:0,vy:0,hp,max:hp,dir:-1,tt:Math.random()*100,flash:0,active:false,jt:60,ground:true}}

function bossSet(p,l,ax){
  const pp=Math.min(p,4),list=[];
  const belly=(hp,x)=>({t:4,x:x||ax+W-110,y:GY-58,w:42,h:58,hp,max:hp,dir:-1,tt:0,flash:0,mode:'walk',ph:0});
  const hover=hp=>({t:5,x:ax+W/2-22,y:124,ty:124,w:44,h:26,hp,max:hp,dir:-1,tt:0,flash:0,mode:'track',ph:0});
  const big=hp=>({t:6,x:ax+W-86,y:GY-40,w:74,h:40,hp,max:hp,dir:-1,tt:0,flash:0,mode:'idle',ph:0});
  if(l<2||p<3)list.push(belly(16+pp*8+l*6));
  else if(p===3)list.push(big(44),hover(26));
  else if(p<6)list.push(big(50),belly(30,ax+W-170));
  else list.push(big(55),hover(32),belly(34,ax+W-170));
  return list;
}

function build(p,l){
  const P=PL[p],r=rng(p*31+l*7+5),len=1500+l*350+Math.min(p,4)*150,arenaX=len,worldW=len+W,segs=[];
  if(P.gaps){let x=0,w=320;while(x<len-260){segs.push([x,x+w]);x+=w+36+Math.floor(r()*20)+l*4;w=160+Math.floor(r()*180)}segs.push([x,worldW])}
  else segs.push([0,worldW]);
  const sol=(a,b)=>segs.some(s=>a>=s[0]&&b<=s[1]);
  const plats=[];for(let x=420;x<len-220;x+=260+Math.floor(r()*200))if(r()<.55)plats.push({x,y:GY-44,w:56+Math.floor(r()*30)});
  const n=5+l*3+Math.min(p,4)*2,mons=[];
  for(let i=0;i<n;i++){
    let x=380+(len-580)*(i/(n-1))+(r()*60-30),t=P.types[Math.floor(r()*P.types.length)];
    if(l===0&&MT[t].diff>0&&r()<.5)t=0;
    let k=0;while(!sol(x,x+MT[t].w)&&k++<40)x+=12;
    mons.push(mk(t,x,p));
  }
  const tanks=[];for(let x=320;x<len-100;x+=470){let tx=x,k=0;while(!sol(tx-4,tx+14)&&k++<30)tx+=10;tanks.push({x:tx,y:GY-15})}
  tanks.push({x:arenaX+50,y:GY-15});
  return{p,l,P,segs,plats,mons,tanks,bosses:bossSet(p,l,arenaX),arenaX,worldW,bullets:[],spits:[],flames:[],parts:[],locked:false,bossDead:0,stormT:0,fireT:120,kills:0};
}

function startLevel(p,l){
  cur={p,l};lv=build(p,l);camX=0;
  player={x:40,y:GY-24,w:14,h:24,vx:0,mvx:0,vy:0,dir:1,ground:true,inv:0,cool:0,slow:0,kb:0,wt:0,safeX:40,life:100,o2:100};
  banner={t:'ΕΠΙΠΕΔΟ '+(l+1),s:PL[p].hint,n:160};state='play';
}

function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=.6+Math.random()*2;lv.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.8,life:30+Math.random()*25,c:Array.isArray(c)?c[i%c.length]:c})}}
function pop(m,n){burst(m.x+m.w/2,m.y+m.h/2,['#ffcf4a','#ff7ad9','#ffffff','#7fffd4'],n||16);sfx('pop')}
function hurt(n,force,dir){
  const pl=player;if(lv.bossDead||state!=='play')return;if(pl.inv>0&&!force)return;
  pl.life-=n;pl.inv=70;if(dir)pl.kb=dir*4;sfx('hurt');buzz(40);burst(pl.x+7,pl.y+10,'#ff8a8a',6);
  if(pl.life<=0){pl.life=0;lose('ΤΑ ΤΕΡΑΤΑ ΚΕΡΔΙΣΑΝ ΑΥΤΗ ΤΗ ΦΟΡΑ')}
}
function lose(msg){state='over';endInfo={msg};sfx('lose');buzz(200)}
function winLevel(){
  const{p,l}=cur,before=PL.map((_,i)=>unlocked(i)),wasAll=done.every(d=>d>=3);
  if(done[p]<l+1)done[p]=l+1;save();
  const newly=PL.map((_,i)=>i).filter(i=>unlocked(i)&&!before[i]);
  if(!wasAll&&done.every(d=>d>=3))state='win';
  else if(newly.length){state='next';endInfo={newly,launch:0}}
  else state='clear';
}

/* ---------- update ---------- */
function enemyAhead(){
  const pl=player,px=pl.x+pl.w/2,near=m=>{const dx=(m.x+m.w/2-px)*pl.dir;return dx>0&&dx<280};
  return lv.mons.some(m=>m.active&&near(m)&&Math.abs(m.y+m.h/2-(pl.y+12))<50)||(lv.locked&&lv.bosses.some(b=>b.hp>0&&near(b)));
}

function update(){
  tick++;
  if(state==='next'&&endInfo.launch){if(++endInfo.launch>95){state='planets';sel=endInfo.newly[0]}return}
  if(state!=='play')return;
  const P=lv.P,pl=player;
  if(banner&&--banner.n<=0)banner=null;
  lv.stormT++;

  let wind=0;if(P.wind){const ph=lv.stormT%600;if(ph>280&&ph<500)wind=-1.05*Math.min(1,(ph-280)/30,(500-ph)/30)}
  const mv=(keys.right?1:0)-(keys.left?1:0),sp=pl.slow>0?1.1:2.2;
  if(P.ice)pl.mvx+=(mv*sp-pl.mvx)*(pl.ground?.045:.08);else pl.mvx=mv*sp;
  pl.vx=pl.mvx+pl.kb+wind;pl.kb*=.85;if(Math.abs(pl.kb)<.1)pl.kb=0;
  if(mv){pl.dir=mv;if(pl.ground)pl.wt++}
  if(keys.jump&&pl.ground){pl.vy=P.jump;pl.ground=false;sfx('jump')}
  if(!keys.jump&&pl.vy<P.jump*.45)pl.vy=P.jump*.45;
  pl.vy=Math.min(pl.vy+P.g,9);
  const left=lv.locked?lv.arenaX:0;
  pl.x=Math.max(left,Math.min(lv.worldW-pl.w,pl.x+pl.vx));
  if(pl.y+pl.h>GY+2&&!pl.ground){const g=gapAt(pl.x+pl.w/2);if(g)pl.x=Math.max(g[0],Math.min(g[1]-pl.w,pl.x))}
  const pb=pl.y+pl.h;pl.y+=pl.vy;pl.ground=false;
  if(pl.vy>=0){
    const b=pl.y+pl.h;
    if(pb<=GY+.5&&b>=GY&&supported(pl.x+3,pl.x+pl.w-3)){pl.y=GY-pl.h;pl.vy=0;pl.ground=true;if(solid(pl.x,pl.x+pl.w))pl.safeX=pl.x}
    else for(const f of lv.plats){if(pb<=f.y+.5&&b>=f.y&&pl.x+pl.w-3>f.x&&pl.x+3<f.x+f.w){pl.y=f.y-pl.h;pl.vy=0;pl.ground=true;break}}
  }
  if(pl.y>H+20){hurt(20,true);if(state!=='play')return;pl.x=pl.safeX;pl.y=GY-pl.h-30;pl.vy=0;pl.kb=0;pl.mvx=0}

  if(pl.cool>0)pl.cool--;
  if((keys.fire||(autoFire&&enemyAhead()))&&pl.cool<=0&&!lv.bossDead){lv.bullets.push({x:pl.dir>0?pl.x+pl.w+3:pl.x-11,y:pl.y+10,vx:pl.dir*7,life:60});pl.cool=11;sfx('shoot')}
  if(pl.inv>0)pl.inv--;if(pl.slow>0)pl.slow--;

  if(!lv.bossDead){pl.o2-=100/(42*60)*P.o2;if(pl.o2<=0){pl.o2=0;return lose('ΤΕΛΕΙΩΣΕ ΤΟ ΟΞΥΓΟΝΟ!')}}

  if(!lv.locked&&pl.x>lv.arenaX+60){
    lv.locked=true;sfx('boss');const many=lv.bosses.length>1,hasBig=lv.bosses.some(b=>b.t===6);
    banner={t:many?'ΑΡΧΗΓΟΙ: '+lv.bosses.length:'ΑΡΧΗΓΟΣ!',s:hasBig?'ΠΗΔΑ ΠΑΝΩ ΑΠΟ ΤΟ ΛΕΙΖΕΡ':'ΠΟΛΥ ΔΥΣΚΟΛΟ',n:130,red:true};
  }
  const target=lv.locked?lv.arenaX:Math.max(0,Math.min(lv.arenaX,pl.x-170));
  camX+=(target-camX)*.15;

  for(const k of lv.tanks)if(!k.got&&overlap(pl,{x:k.x,y:k.y,w:9,h:14})){k.got=1;pl.o2=Math.min(100,pl.o2+35);sfx('pick');burst(k.x+4,k.y+6,'#7fd6ff',8)}

  const pcx=pl.x+pl.w/2;
  for(const m of lv.mons){
    if(!m.active){if(m.x<camX+W+10)m.active=true;else continue}
    const M=MT[m.t];m.tt++;if(m.flash>0)m.flash--;
    const dx=pcx-(m.x+m.w/2);m.dir=dx<0?-1:1;
    let vx=Math.abs(dx)<260&&Math.abs(dx)>4?m.dir*M.speed:0;
    if(m.t===2){m.jt--;if(m.ground&&Math.abs(dx)<120&&m.jt<=0){m.vy=-5;m.jt=90;m.ground=false}if(!m.ground)vx=m.dir*1.7}
    const nx=m.x+vx;if(!m.ground||solid(nx+2,nx+m.w-2))m.x=nx;
    m.vy=Math.min(m.vy+P.g,9);const mb=m.y+m.h;m.y+=m.vy;m.ground=false;
    if(m.vy>=0&&mb<=GY+.5&&m.y+m.h>=GY&&supported(m.x+3,m.x+m.w-3)){m.y=GY-m.h;m.vy=0;m.ground=true}
    if(m.y>H+40)m.dead=1;
    if(!m.dead&&overlap(pl,m)){if(m.t===3&&pl.inv<=0)pl.slow=70;hurt(M.dmg,false,m.dir)}
    if(state!=='play')return;
  }

  if(lv.locked)for(const B of lv.bosses){
    if(B.hp<=0)continue;
    B.tt++;B.ph++;if(B.flash>0)B.flash--;
    const dx=pcx-(B.x+B.w/2);B.dir=dx<0?-1:1;
    if(B.t===4){
      const shots=lv.l===2?5:3;
      if(B.mode==='walk'){if(Math.abs(dx)>20)B.x+=B.dir*(.5+Math.min(lv.p,4)*.12);if(B.ph>110){B.mode='shoot';B.ph=0}}
      else{if(B.ph%16===1&&B.ph<16*shots){const i=Math.floor(B.ph/16);lv.spits.push({x:B.x+B.w/2+B.dir*12,y:B.y+B.h*.55,vx:B.dir*(1.4+i*.75),vy:-3.2+i*.25});sfx('spit')}if(B.ph>16*shots+40){B.mode='walk';B.ph=0}}
      B.x=Math.max(lv.arenaX+10,Math.min(lv.arenaX+W-B.w-10,B.x));
    }else if(B.t===5){
      if(B.mode==='track'){if(Math.abs(dx)>6)B.x+=Math.sign(dx)*.9;B.ty=124+Math.sin(B.tt*.05)*10;if(B.ph>150){B.mode='warn';B.ph=0}}
      else if(B.mode==='warn'){if(B.ph>40){B.mode='beam';B.ph=0;sfx('beam')}}
      else if(B.mode==='beam'){if(B.ph>60){B.mode='tired';B.ph=0}
        if(overlap(pl,{x:B.x+B.w/2-6,y:B.y+B.h,w:12,h:GY-B.y-B.h}))hurt(14,false,pcx<B.x+B.w/2?-1:1)}
      else{B.ty=184;if(B.ph>110){B.mode='track';B.ph=0}}
      B.y+=(B.ty-B.y)*.05;
      B.x=Math.max(lv.arenaX+10,Math.min(lv.arenaX+W-B.w-10,B.x));
    }else{
      if(B.mode==='idle'){if(B.ph>100){B.mode='charge';B.ph=0;sfx('charge')}}
      else if(B.mode==='charge'){if(B.ph>55){B.mode='fire';B.ph=0;sfx('laser')}}
      else{if(B.ph>45){B.mode='idle';B.ph=0}
        if(overlap(pl,{x:lv.arenaX,y:GY-17,w:B.x-lv.arenaX,h:8}))hurt(16,false,-1)}
    }
    if(overlap(pl,B))hurt(MT[B.t].dmg,false,B.dir);
    if(state!=='play')return;
  }

  for(const b of lv.bullets){
    b.x+=b.vx;b.life--;const bb={x:b.x,y:b.y-1,w:8,h:4};
    for(const m of lv.mons)if(m.active&&!m.dead&&overlap(bb,m)){b.life=0;m.hp--;m.flash=6;sfx('hit');if(m.hp<=0){m.dead=1;lv.kills++;pop(m)}break}
    if(b.life>0&&lv.locked)for(const B of lv.bosses){if(B.hp>0&&overlap(bb,B)){b.life=0;B.hp--;B.flash=5;sfx('hit');if(B.hp<=0){pop(B,44);lv.kills++;buzz(60)}break}}
  }
  lv.bullets=lv.bullets.filter(b=>b.life>0);lv.mons=lv.mons.filter(m=>!m.dead);
  if(lv.locked&&!lv.bossDead&&lv.bosses.every(B=>B.hp<=0)){lv.bossDead=1;pl.inv=999;sfx('clear');banner={t:'ΝΙΚΗ!',s:'',n:100}}

  for(const s of lv.spits){s.x+=s.vx;s.y+=s.vy;s.vy+=.12;if(overlap(pl,{x:s.x-3,y:s.y-3,w:6,h:6})){s.dead=1;hurt(10,false,Math.sign(s.vx))}if(s.y>GY){s.dead=1;burst(s.x,GY-2,'#8ad66a',4)}}
  lv.spits=lv.spits.filter(s=>!s.dead);

  if(P.fire&&!lv.bossDead&&--lv.fireT<=0){lv.fireT=(lv.l===2?55:80)+Math.random()*40;const fx=pl.x+Math.random()*200-60;lv.flames.push({x:Math.max(camX+12,Math.min(camX+W-12,fx)),y:-10,vy:1.5})}
  for(const f of lv.flames){f.y+=f.vy;f.vy+=.02;if(overlap(pl,{x:f.x-4,y:f.y-4,w:8,h:8})){f.dead=1;hurt(10,false,0)}if(f.y>=GY-2){f.dead=1;burst(f.x,GY-3,['#ffcf4a','#ff7a2a'],7)}}
  lv.flames=lv.flames.filter(f=>!f.dead);

  for(const q of lv.parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.06;q.life--}
  lv.parts=lv.parts.filter(q=>q.life>0);

  if(lv.bossDead&&++lv.bossDead>110)winLevel();
}

const PX=[[96,92,18],[192,92,19],[288,92,19],[384,92,24],[150,168,19],[240,168,19],[330,168,22]];
function drawPlanets(){
  R(0,0,W,H,'#0c0b22');drawStars(tick*.15);
  titleBox('ΔΙΑΛΕΞΕ ΠΛΑΝΗΤΗ',240,34);
  PX.forEach(([x,y0,r],i)=>{
    const lock=!unlocked(i),on=i===sel,y=y0+(on?Math.sin(tick*.08)*2:0);
    if(on){ctx.strokeStyle='#ffcf4a';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(x,y,r+7,0,7);ctx.stroke();ctx.setLineDash([])}
    ctx.globalAlpha=lock?.35:1;drawPlanet(i,x,y,r);ctx.globalAlpha=1;
    if(lock)drawLock(x-5,y-7);
    T(PL[i].name,x,y0+r+6,{align:'center',col:on?'#ffcf4a':'#f3eedc'});
    for(let k=0;k<3;k++){R(x-13+k*10,y0+r+18,6,6,OUT);R(x-12+k*10,y0+r+19,4,4,k<done[i]?'#ffcf4a':'#3a3866')}
    hits.push({x:x-44,y:y0-30,w:88,h:r+56,fn:()=>{if(sel===i)choosePlanet();else sel=i}});
  });
  arrow(26,130,-1,()=>sel=(sel+6)%7);arrow(454,130,1,()=>sel=(sel+1)%7);
  if(!unlocked(sel))T(sel<=3?'ΚΛΕΙΔΩΜΕΝΟΣ: ΤΕΛΕΙΩΣΕ ΠΡΩΤΑ ΤΟΝ ΠΡΟΗΓΟΥΜΕΝΟ':'ΚΛΕΙΔΩΜΕΝΟΣ: ΤΕΛΕΙΩΣΕ ΠΡΩΤΑ ΤΟΝ ΔΙΑ',240,236,{align:'center',col:'#ff8a8a'});
  else btn('ΠΑΙΞΕ: '+PL[sel].name,150,230,180,26,choosePlanet,true);
}

function drawLevels(){
  const p=sel,P=PL[p],cx=240,cy=930,r=760;
  R(0,0,W,H,P.sky);drawStars(tick*.1);
  bar(8,16,70,10,100,'#9be15d','ΖΩΗ');bar(94,16,110,10,100,'#4fb8ff','ΟΞΥΓΟΝΟ');
  T('ΠΛΑΝΗΤΗΣ '+P.name,472,17,{align:'right'});
  titleBox('ΔΙΑΛΕΞΕ ΕΠΙΠΕΔΟ',240,62);
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.clip();F(0,160,W,H,P.ground);
  for(let k=1;k<7;k++){ctx.beginPath();ctx.arc(cx,cy,r-k*15,0,7);ctx.strokeStyle=k%2?P.band:P.top;ctx.globalAlpha=.35;ctx.lineWidth=6;ctx.stroke()}
  ctx.globalAlpha=1;[[60,232,10],[170,250,7],[320,236,12],[430,258,8],[250,262,6]].forEach(([x,y,s])=>ell(x,y,s,s*.4,P.spot));
  ctx.restore();
  ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.strokeStyle=P.top;ctx.lineWidth=2;ctx.stroke();
  [90,240,390].forEach((x,i)=>{
    const ys=cy-Math.sqrt(r*r-(x-cx)**2),lock=!levelOpen(p,i),fin=i<done[p],on=i===lsel;
    ell(x,ys+26,7,3,OUT);
    ctx.strokeStyle=OUT;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,ys+26);ctx.lineTo(x,ys-26);ctx.stroke();
    if(on){ctx.strokeStyle='#ffcf4a';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,ys-38,16+Math.sin(tick*.12)*1.5,0,7);ctx.stroke()}
    circ(x,ys-38,13,OUT);circ(x,ys-38,11,lock?'#6c6a8a':fin?'#9be15d':'#ffcf4a');
    if(lock)drawLock(x-5,ys-45);else T(String(i+1),x,ys-42,{align:'center',col:'#1a1830',shadow:false});
    T('ΕΠΙΠΕΔΟ',x,ys-64,{align:'center',col:on?'#ffcf4a':'#f3eedc'});
    if(fin)T('ΤΕΛΕΙΩΣΕ',x,ys+36,{align:'center',col:'#9be15d'});
    if(on&&!lock)drawAstro(x-30,ys-18+(i===1?2:0),1,0);
    hits.push({x:x-40,y:ys-74,w:80,h:120,fn:()=>{if(lsel===i)chooseLevel(i);else lsel=i}});
  });
  btn('ΠΛΑΝΗΤΕΣ',8,238,92,22,()=>state='planets',false);
  T(levelOpen(p,lsel)?'ΑΓΓΙΞΕ ΞΑΝΑ ΓΙΑ ΝΑ ΠΑΙΞΕΙΣ':'ΚΛΕΙΔΩΜΕΝΟ',288,245,{align:'center',col:'#f3eedc'});
}

function skyDeco(p){
  const ox=-camX*.03;
  if(p===0){circ(390+ox,58,15,'#2f6fd0');ell(385+ox,52,6,4,'#5fbf6a');ell(396+ox,64,5,3,'#5fbf6a');ell(392+ox,46,4,1.5,'#ffffff')}
  if(p===1){circ(400+ox,50,9,'#ffd98a');circ(330+ox,80,3,'#9a8a80');circ(150+ox,40,2,'#9a8a80')}
  if(p===2){ctx.globalAlpha=.22;ctx.strokeStyle='#ead9a6';ctx.lineWidth=10;ctx.beginPath();ctx.ellipse(240+ox*3,30,420,46,0,0,Math.PI);ctx.stroke();ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(240+ox*3,30,450,58,0,0,Math.PI);ctx.stroke();ctx.globalAlpha=1}
  if(p===3){circ(380+ox,56,8,'#e8d06a');circ(130+ox,80,5,'#c9b9a0')}
  if(p===4){circ(400+ox,60,5,'#fff2c4');ctx.globalAlpha=.25;ctx.strokeStyle='#d4eef2';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(120+ox*3,40,30,120,.2,0,7);ctx.stroke();ctx.globalAlpha=1}
  if(p===5){circ(410+ox,50,3,'#fff2c4');circ(160+ox,70,6,'#c8d8e8')}
  if(p===6){ctx.globalAlpha=.18;for(let k=0;k<5;k++)circ(80+k*95+ox*2,30+((k*53)%40),40+k*6,'#ffb347');ctx.globalAlpha=1}
}

function drawGame(){
  const P=lv.P,pl=player;
  R(0,0,W,H,P.sky);drawStars(camX*.15);skyDeco(lv.p);
  for(const s of lv.segs){
    const x0=s[0]-camX,x1=s[1]-camX;if(x1<0||x0>W)continue;
    const a=Math.max(0,x0),b=Math.min(W,x1);
    R(a,GY,b-a,H-GY,P.ground);R(a,GY,b-a,3,P.top);R(a,GY+16,b-a,14,P.band);R(a,GY+36,b-a,4,P.band);
    if(x0>=-2)R(x0,GY,2,H-GY,OUT);if(x1<=W+2)R(x1-2,GY,2,H-GY,OUT);
  }
  for(let wx=Math.floor(camX/64)*64;wx<camX+W+64;wx+=64){const h=hsh(wx),sx=wx+h%40;if(solid(sx-12,sx+12))ell(sx-camX,GY+9+(h%3)*13,6+h%4,2.5,P.spot)}
  if(P.ice)for(let wx=Math.floor(camX/90)*90;wx<camX+W+90;wx+=90){if(solid(wx,wx+30))R(wx-camX+(hsh(wx)%50),GY+1,22,1,'#ffffff')}
  for(const f of lv.plats){const x=f.x-camX;if(x>W||x+f.w<0)continue;R(x-1,f.y-1,f.w+2,10,OUT);R(x,f.y,f.w,8,P.band);R(x,f.y,f.w,2,P.top)}
  for(const k of lv.tanks){if(k.got)continue;const x=k.x-camX;if(x<-10||x>W)continue;const y=k.y+Math.sin(tick*.1+k.x)*1.5;R(x-1,y+1,11,14,OUT);R(x,y+2,9,12,'#3fa7e0');R(x+2,y-1,5,3,'#cfd6e6');R(x+1,y+6,7,2,'#e8f6ff')}
  for(const f of lv.flames){const sx=f.x-camX,k=Math.max(0,Math.min(1,f.y/GY));if((tick>>2)%2||k>.7){ctx.globalAlpha=.5;ell(sx,GY+1,4+k*6,2,'#3a0a04');ctx.globalAlpha=1}}
  for(const m of lv.mons)if(m.active)drawMonster(m);
  if(lv.locked){
    for(const B of lv.bosses){
      if(B.hp<=0)continue;
      if(B.t===5&&(B.mode==='warn'||B.mode==='beam')){const bx=B.x+B.w/2-camX,top=B.y+B.h;
        if(B.mode==='warn'){if((tick>>2)%2)R(bx-1,top,2,GY-top,'#ff6b6b')}
        else{ctx.globalAlpha=.85;R(bx-6,top,12,GY-top,'#3fdc9a');R(bx-2,top,4,GY-top,'#d8fff0');ctx.globalAlpha=1}}
      if(B.t===6&&(B.mode==='charge'||B.mode==='fire')){const x0=lv.arenaX-camX,x1=B.x-camX;
        if(B.mode==='charge'){if((tick>>2)%2)for(let x=x0;x<x1;x+=10)R(x,GY-13,5,1,'#ff6b6b')}
        else{R(x0,GY-17,x1-x0,8,'#1f8f5f');R(x0,GY-15,x1-x0,4,'#7dffbf');R(x0,GY-14,x1-x0,2,'#ffffff')}}
    }
  }
  for(const B of lv.bosses){if(B.hp<=0||B.x-camX>W+40)continue;if(B.t===4)drawMonster(B);else drawUFO(B)}
  drawAstro(pl.x-camX,pl.y,pl.dir,pl.wt,pl.inv>0&&pl.inv<900);
  if(pl.slow>0&&(tick>>3)%2)T('!',pl.x-camX+4,pl.y-12,{col:'#55a7cf'});
  for(const b of lv.bullets){const x=b.x-camX;R(x,b.y,8,3,'#fff36b');R(b.vx>0?x-3:x+8,b.y+1,3,1,'#ff9d2e')}
  for(const s of lv.spits){circ(s.x-camX,s.y,3.5,OUT);circ(s.x-camX,s.y,2.5,'#8ad66a')}
  for(const f of lv.flames){const x=f.x-camX;circ(x,f.y,5,'#ff7a2a');circ(x,f.y,3,'#ffcf4a');R(x-1,f.y-10,2,5,'#ff7a2a')}
  for(const q of lv.parts){const x=q.x-camX;ctx.globalAlpha=Math.min(1,q.life/20);R(x-1,q.y,3,1,q.c);R(x,q.y-1,1,3,q.c)}ctx.globalAlpha=1;
  for(const m of lv.mons)if(m.active)monsterUI(m);
  if(lv.locked)for(const B of lv.bosses)if(B.hp>0)monsterUI(B);

  if(P.storm){const ph=lv.stormT%720;if(ph>360&&ph<620){const f=Math.min(1,(ph-360)/40,(620-ph)/40);ctx.globalAlpha=.66*f;R(0,0,W,H,'#c8693e');ctx.globalAlpha=.55*f;for(let i=0;i<40;i++){const y=(i*37)%H,x=((i*97-tick*6)%W+W)%W;R(x,y,30,1,'#f6cfa6')}ctx.globalAlpha=1;if(f>.5)T('ΑΜΜΟΘΥΕΛΛΑ!',240,44,{align:'center',col:'#ffcf4a'})}}
  if(P.wind){const ph=lv.stormT%600;if(ph>280&&ph<500){const f=Math.min(1,(ph-280)/30,(500-ph)/30);ctx.globalAlpha=.4*f;for(let i=0;i<26;i++){const y=30+(i*53)%190,x=((i*131-tick*9)%W+W)%W;R(x,y,40,1,'#e8f6ff')}ctx.globalAlpha=1;if(f>.5)T('ΑΝΕΜΟΣ!',240,44,{align:'center',col:'#8fd0f5'})}}

  bar(8,16,90,10,pl.life,'#9be15d','ΖΩΗ');
  T('ΕΠΙΠΕΔΟ '+(lv.l+1),106,17);
  const bmax=lv.bosses.reduce((a,b)=>a+b.max,0),bnow=lv.bosses.reduce((a,b)=>a+Math.max(0,b.hp),0),alive=lv.bosses.filter(b=>b.hp>0).length;
  bar(206,16,116,10,bnow/bmax*100,'#ff4d5e',lv.bosses.length>1?'ΑΡΧΗΓΟΙ: '+alive:'ΑΡΧΗΓΟΣ');
  T('ΠΛΑΝΗΤΗΣ '+P.name,472,17,{align:'right'});
  'ΟΞΥΓΟΝΟ'.split('').forEach((ch,i)=>T(ch,4,50+i*15,{col:'#8fd0f5'}));
  R(15,49,12,112,OUT);R(16,50,10,110,'#2a2840');const oh=Math.round(110*pl.o2/100);R(16,160-oh,10,oh,pl.o2<25&&(tick>>4)%2?'#ff6b6b':'#4fb8ff');
  T(Math.ceil(pl.o2)+'%',4,166,{col:pl.o2<25?'#ff8a8a':'#f3eedc'});
  if(state==='play'){R(452,32,20,16,OUT);R(453,33,18,14,'#2e2b6b');R(458,36,3,8,'#f3eedc');R(464,36,3,8,'#f3eedc');hits.push({x:446,y:28,w:30,h:24,fn:toMap})}
  if(banner){ctx.globalAlpha=Math.min(1,banner.n/20);T(banner.t,240,92,{align:'center',size:16,col:banner.red?'#ff6b6b':'#ffcf4a'});if(banner.s)T(banner.s,240,116,{align:'center'});ctx.globalAlpha=1}
}

function drawNext(){
  R(0,0,W,H,'#0c0b22');drawStars(tick*.2);
  ctx.fillStyle='#d9dbe4';ctx.beginPath();ctx.moveTo(0,206);ctx.quadraticCurveTo(240,190,480,200);ctx.lineTo(480,270);ctx.lineTo(0,270);ctx.fill();
  ctx.strokeStyle=OUT;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,206);ctx.quadraticCurveTo(240,190,480,200);ctx.stroke();
  T('ΕΠΟΜΕΝΟΣ',240,40,{align:'center',size:16,col:'#ffcf4a'});
  T('ΠΛΑΝΗΤΗΣ',240,62,{align:'center',size:16,col:'#ffcf4a'});
  const n=endInfo.newly;
  T(n.length>1?'ΞΕΚΛΕΙΔΩΣΕΣ ΤΟΥΣ ΠΛΑΝΗΤΕΣ:':'ΞΕΚΛΕΙΔΩΣΕΣ ΤΟΝ ΠΛΑΝΗΤΗ:',30,104);
  n.forEach((p,i)=>{const x=64+i*92;drawPlanet(p,x,148,16);T(PL[p].name,x,172,{align:'center'})});
  const L=endInfo.launch||0,ry=198-(L>15?(L-15)**2*.06:0)+(L&&L<=15?(tick%2):0);
  drawRocket(408,ry,L>0);
  if(L>10)for(let k=0;k<4;k++){ctx.globalAlpha=.4;circ(400+((tick*7+k*13)%20),200+((k*5)%6),5+k,'#cfd2dc')}ctx.globalAlpha=1;
  if(!L)btn('ΑΠΟΓΕΙΩΣΗ!',30,222,150,28,launch,true);
}
function launch(){if(!endInfo.launch){endInfo.launch=1;sfx('rocket');buzz(120)}}

function drawEnd(){
  drawGame();R(0,0,W,H,'rgba(8,6,24,.74)');
  if(state==='clear'){
    T('ΜΠΡΑΒΟ!',240,64,{align:'center',size:16,col:'#ffcf4a'});
    T('ΤΟ ΕΠΙΠΕΔΟ '+(cur.l+1)+' ΤΕΛΕΙΩΣΕ',240,94,{align:'center'});
    T('ΤΕΡΑΤΑ ΠΟΥ ΕΣΚΑΣΑΝ: '+lv.kills,240,112,{align:'center',col:'#aaa7d8'});
    btn('ΣΥΝΕΧΕΙΑ',170,150,140,28,goNext,true);
  }else if(state==='over'){
    T('ΤΕΛΟΣ ΠΑΙΧΝΙΔΙΟΥ',240,70,{align:'center',size:16,col:'#ff6b6b'});
    T(endInfo.msg,240,102,{align:'center'});
    btn('ΞΑΝΑ',130,140,100,28,()=>startLevel(cur.p,cur.l),true);
    btn('ΧΑΡΤΗΣ',250,140,100,28,toMap,false);
  }else{
    T('ΕΣΩΣΕΣ ΤΟ',240,48,{align:'center',size:16,col:'#ffcf4a'});
    T('ΗΛΙΑΚΟ ΣΥΣΤΗΜΑ!',240,72,{align:'center',size:16,col:'#ffcf4a'});
    drawAstro(233,110+Math.abs(Math.sin(tick*.15))*-8,(tick>>4)%2?1:-1,tick);
    T('ΟΛΟΙ ΟΙ ΠΛΑΝΗΤΕΣ ΕΙΝΑΙ ΑΣΦΑΛΕΙΣ',240,150,{align:'center',col:'#9be15d'});
    btn('ΠΛΑΝΗΤΕΣ',170,176,140,28,()=>{state='planets';sel=0},true);
  }
}

function draw(){
  hits=[];ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  if(state==='planets')drawPlanets();else if(state==='levels')drawLevels();else if(state==='play')drawGame();else if(state==='next')drawNext();else drawEnd();
}

/* ---------- navigation ---------- */
function choosePlanet(){if(!unlocked(sel)){sfx('hurt');return}state='levels';lsel=allOpen?0:Math.min(2,done[sel])}
function chooseLevel(i){if(!levelOpen(sel,i)){sfx('hurt');return}startLevel(sel,i)}
function toMap(){sel=cur.p;lsel=cur.l;state='levels'}
function goNext(){if(cur.l<2){sel=cur.p;lsel=cur.l+1;state='levels'}else{sel=cur.p;state='planets'}}

/* ---------- input ---------- */
const autoBtn=document.getElementById('b-auto');
function setAuto(v){autoFire=v;autoBtn.classList.toggle('lit',v);autoBtn.setAttribute('aria-pressed',String(v));save()}
setAuto(autoFire);
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'fire',KeyX:'fire',KeyJ:'fire'};
addEventListener('keydown',e=>{
  const onBtn=e.target&&e.target.closest&&e.target.closest('button');
  if(onBtn&&(e.code==='Space'||e.code==='Enter'))return;
  audio();
  const k=KM[e.code];if(k){keys[k]=1;e.preventDefault()}
  if(e.code==='ArrowDown')e.preventDefault();
  if(e.repeat)return;
  const c=e.code,ok=c==='Enter'||c==='Space',back=c==='Escape'||c==='Backspace';
  if(c==='KeyF')setAuto(!autoFire);
  if(state==='planets'){if(c==='ArrowLeft'||c==='KeyA'){sel=(sel+6)%7;sfx('sel')}if(c==='ArrowRight'||c==='KeyD'){sel=(sel+1)%7;sfx('sel')}if(c==='ArrowDown'&&sel<4){sel=Math.min(6,sel+4);sfx('sel')}if(c==='ArrowUp'&&sel>=4){sel-=4;sfx('sel')}if(ok)choosePlanet()}
  else if(state==='levels'){if(c==='ArrowLeft'||c==='KeyA'){lsel=Math.max(0,lsel-1);sfx('sel')}if(c==='ArrowRight'||c==='KeyD'){lsel=Math.min(2,lsel+1);sfx('sel')}if(ok)chooseLevel(lsel);if(back){state='planets';e.preventDefault()}}
  else if(state==='play'){if(c==='Escape')toMap()}
  else if(state==='clear'){if(ok)goNext()}
  else if(state==='next'){if(ok)launch()}
  else if(state==='over'){if(ok)startLevel(cur.p,cur.l);if(back)toMap()}
  else if(state==='win'){if(ok){state='planets';sel=0}}
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=0});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
cv.addEventListener('pointerdown',e=>{
  audio();const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){sfx('sel');h.fn();return}}
});

const pad=document.getElementById('pad'),hints=document.getElementById('hints');
pad.hidden=!coarse;hints.hidden=coarse;if(coarse)document.body.classList.add('touch');
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();audio();keys[k]=1;b.classList.add('on');buzz(8);try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const off=()=>{keys[k]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
autoBtn.addEventListener('pointerdown',e=>{e.preventDefault();audio();setAuto(!autoFire);buzz(10)});
autoBtn.addEventListener('click',e=>{if(e.detail===0)setAuto(!autoFire)});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>{if(coarse)e.preventDefault()});

const snd=document.getElementById('snd');
snd.addEventListener('click',()=>{muted=!muted;snd.textContent='Ήχος: '+(muted?'όχι':'ναι');snd.blur()});
document.getElementById('unlock').addEventListener('click',e=>{allOpen=true;save();state='planets';e.currentTarget.blur()});
const reset=document.getElementById('reset');let armed=0;
reset.addEventListener('click',()=>{
  if(!armed){armed=1;reset.textContent='Σίγουρα; Πάτα ξανά';setTimeout(()=>{armed=0;reset.textContent='Νέο παιχνίδι'},3000);return}
  armed=0;reset.textContent='Νέο παιχνίδι';done=[0,0,0,0,0,0,0];allOpen=false;save();state='planets';sel=0;reset.blur();
});

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){update();acc-=1000/60}draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
